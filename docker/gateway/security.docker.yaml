# AEGIS — zokastech.fr — Apache 2.0 / MIT
# Fusion sécurité pour l’image Docker — « secure by default » depuis v0.2.0.
#
# - Authentification ACTIVE (clés API hashées + RBAC). Créez des clés avec `aegis-keygen`
#   (voir docs/INSTALL.md) et fournissez le pepper via AEGIS_API_KEY_PEPPER.
# - TLS : certificat auto-signé généré au PREMIER démarrage dans /var/lib/aegis/tls
#   (plus aucune clé privée embarquée dans l’image). Montez vos propres cert/key pour la prod.
# - Démo locale sans auth : AEGIS_SECURITY_PRODUCTION=false + AEGIS_SECURITY_DEVELOPMENT_DISABLE_AUTH=true
#   (refusé si production=true).

production: true

development:
  disable_auth: false

tls:
  enabled: true
  cert_file: /var/lib/aegis/tls/server.crt
  key_file: /var/lib/aegis/tls/server.key
  auto_generate_self_signed: true
  auto_gen_cert_dir: /var/lib/aegis/tls
  client_ca_file: ""

mtls:
  require: false

cors:
  # Le dashboard passe par le reverse-proxy nginx (même origine) : aucun CORS nécessaire.
  allow_origins: []

# Reverse-proxies autorisés à fournir X-Forwarded-For (ex. réseau Docker du dashboard).
# Vide = IP TCP directe (en-têtes ignorés).
trusted_proxies: []

api_keys:
  file_path: /var/lib/aegis/api_keys.yaml
  pepper: ""

rbac:
  backend: yaml
  file_path: /etc/aegis/rbac/rbac.yaml
  postgres_dsn: ""

jwt:
  enabled: false

oidc:
  enabled: false

grpc:
  reflection: false

audit:
  backend: file
  file_path: /var/lib/aegis/audit.jsonl
  postgres_dsn: ""
  rotate_max_mb: 50
  rotate_max_age: 24h
  archive_dir: /var/lib/aegis/audit-archive
