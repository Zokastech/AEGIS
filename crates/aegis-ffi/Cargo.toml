# AEGIS — zokastech.fr — Apache 2.0 / MIT

[package]
name = "aegis-ffi"
description = "Bibliothèque C partagée (cdylib/staticlib) — interop AEGIS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["ner-onnx"]
# Inférence L3 ONNX (`ort` + tokenizers). Désactiver : `--no-default-features` (stub mock si ner.model_path défini).
ner-onnx = ["dep:aegis-ner"]
# Dépendances optionnelles pour extensions Python / Node (crates SDK dédiés recommandés).
python = ["dep:pyo3"]
nodejs = ["dep:napi", "dep:napi-derive"]

[dependencies]
aegis-anonymize = { version = "0.2.0", path = "../aegis-anonymize" }
aegis-core = { version = "0.2.0", path = "../aegis-core" }
aegis-ner = { version = "0.2.0", path = "../aegis-ner", optional = true }
aegis-regex = { version = "0.2.0", path = "../aegis-regex" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

pyo3 = { workspace = true, optional = true }
napi = { version = "2", optional = true, default-features = false, features = ["napi4"] }
napi-derive = { version = "2", optional = true }
